[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deepege-connector"
version = "0.1.0"
description = "Deepege connector: an MCP server that talks to the Deepege Open API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Deepege" }]
keywords = ["mcp", "deepege", "connector"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.22",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "openapi-spec-validator>=0.7",
    "schemathesis>=4.0",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
    "referencing>=0.35",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32",
]

[project.scripts]
deepege-connector = "deepege_connector.server:main"

[project.urls]
Homepage = "https://github.com/deepege/deepege-connector"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepege_connector = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
"tests/mock_core/app.py" = ["B008", "B018"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
